version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      dev:
        dependency-type: development
    ignore:
      # `astro check` (@astrojs/check) only supports TypeScript 5 and 6.
      # Remove once it supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
